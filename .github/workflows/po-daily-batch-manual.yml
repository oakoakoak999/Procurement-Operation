name: PO-Daily batch (scheduled + manual)

# Runs on a schedule (see the cron block) and on demand. Leave `bu` blank to run
# every BU that has a Drive order-folder configured (throttled by max_parallel),
# or pass one code for a single-BU run. Leave `date` blank for today.
#
# Proves the PO-Daily chain works on GitHub Actions: Windows runner -> materialize
# config/tokens from secrets -> headless Chrome -> Odoo login (via odooUrlGha or
# odooUrlGhaProd, auto-selected on GITHUB_ACTIONS) -> print the day's POs ->
# split per-vendor -> upload to the Google Shared Drive.
#
# NO dry-run: PO-daily always takes real actions. The Drive upload de-dups
# against files already there, so a re-run skips existing names rather than
# duplicating — that is the safety net, not a --test mode. Use deliberately.
#
# environment=prod prints and uploads REAL production POs. Dedup does protect
# re-runs there now that the prod folders hold data — a repeat sweep of 03 Aug
# skipped 149 of 151 PSV files and uploaded only the new one. That was not true
# when prod was first cut over, which is why this warning used to say otherwise.
#
# This is the only workflow in the repo, by decision: it is the one pipeline
# cleared for production. PR2PO, Confirm-PO and the connectivity probe were
# removed rather than left idle -- the first two are blocked from prod by
# requireUat() anyway, since they write to Odoo. All three are in git history if
# a cloud path for them is ever wanted again.
on:
  # Times are UTC; Thailand is UTC+7 year-round with no DST, so the offset is a
  # constant 7 hours. GitHub fires scheduled runs late under load -- around an
  # hour is normal and 3 hours has been measured here, so treat every time below
  # as a lower bound, not a schedule. Every day including
  # weekends: POs are raised on Saturdays and Sundays (measured, not assumed).
  schedule:
    # Intraday sweeps: 08:30, 09:30, 10:30, 12:30, 14:30, 15:30 ICT.
    #
    # These are each an hour earlier than the times the sweeps are actually
    # WANTED (09:30, 10:30, 11:30, 13:30, 15:30, 16:30 ICT). That is deliberate
    # delay compensation, not a change to the operating schedule: GitHub
    # consistently fires these late by roughly an hour, so booking an hour early
    # lands the run near the intended time. The target times are unchanged --
    # only the booking moved. Do not "correct" these back without also removing
    # the assumption that a run arrives late.
    #
    # It is compensation for the TYPICAL delay, not a guarantee. The delay is not
    # bounded: ~3 hours has been measured here. A slot that happens to fire on
    # time now runs an hour ahead of the old behaviour, which is harmless -- an
    # early sweep just finds fewer POs and the next one picks them up.
    #
    # Each sweep is a snapshot of what exists at that moment, so the point of
    # repeating is latency -- how soon a PO's PDF reaches Drive -- not coverage.
    # A full 18-BU sweep measured ~14 minutes, well inside the 1-hour spacing,
    # so consecutive runs cannot overlap.
    #
    # One slot per line rather than the equivalent '30 2,3,4,6,8,9 * * *'. That
    # combined form dropped slots: GitHub folds a still-pending run into the next
    # occurrence of the SAME cron string, so any queue delay beyond the 1-hour
    # spacing eats a sweep -- on 04 Aug delays of ~178 and ~198 min left 2 runs
    # out of 4 due slots. Separate entries are separate schedules and do not fold
    # into each other: that morning the 00:30 and 02:30 entries both produced a
    # run despite overlapping. A combined expression also cannot say which slot
    # fired, since github.event.schedule reports the string, not the occurrence.
    - cron: '30 1 * * *'
    - cron: '30 2 * * *'
    - cron: '30 3 * * *'
    - cron: '30 5 * * *'
    - cron: '30 7 * * *'
    - cron: '30 8 * * *'
    # Yesterday sweep, 07:30 ICT. Closes the gap the last intraday sweep leaves
    # open: anything raised between 15:30 and midnight, plus edits to POs that
    # were already uploaded (the pipeline replaces on content-hash change).
    #
    # Deliberately NOT shifted an hour earlier with the intraday sweeps. The
    # runner's shell reports UTC despite TZ=Asia/Bangkok, so `date -d yesterday`
    # is a UTC calculation, evaluated when the run EXECUTES. It agrees with the
    # ICT calendar date only while execution lands at or after 00:00 UTC.
    # Booking this at 06:30 ICT would put it at 23:30 UTC the PREVIOUS day and
    # sweep the day before yesterday. Queue delay cannot rescue that -- it is
    # the nominal slot that would be wrong, and a delay is not guaranteed.
    # Delay is only ever safe in this direction: it pushes execution later,
    # never earlier, so 00:30 UTC firing late stays on the correct date.
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      environment:
        # prod is the default because prod is where the work is: the schedule
        # runs against it, and a manual run is nearly always a top-up or a retry
        # of a scheduled one. uat stays selectable for testing changes to the
        # pipeline, but it is no longer the normal case and defaulting to it
        # meant the common action needed an explicit choice while the rare one
        # happened by accident.
        description: "Which SmartERP — prod is live data; pick uat only to test"
        type: choice
        options: [prod, uat]
        default: prod
      bu:
        description: "BU code (e.g. PSV), or blank for ALL order-folder BUs"
        default: ""
        required: false
      date:
        description: "Target date YYYY-MM-DD, or blank for today"
        default: ""
        required: false
      max_parallel:
        description: "BUs to run in parallel (only when bu is blank)"
        default: "2"
        required: false

permissions:
  contents: write   # runner must push the agent-memory folder (execution log + Episode Index) back

# One sweep at a time, queued rather than cancelled. Two batches running
# concurrently is a real failure mode, not a theoretical one: it hits the Google
# Drive per-user rate limit during the folder-create burst, and the second run
# can clobber the first's state. A late-firing schedule overlapping the next one
# is exactly how that would happen unattended.
concurrency:
  group: po-daily-batch
  cancel-in-progress: false

jobs:
  run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Playwright
        run: npx playwright install chrome

      - name: Materialize config + tokens from secrets
        shell: bash
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          GSHEETS_TOKEN_JSON: ${{ secrets.GSHEETS_TOKEN_JSON }}
          GDRIVE_PO_TOKEN_JSON: ${{ secrets.GDRIVE_PO_TOKEN_JSON }}
        run: |
          # Write each secret to its file via env->printf (no interpretation, no echo).
          printf '%s' "$CONFIG_JSON"          > config.json
          printf '%s' "$GSHEETS_TOKEN_JSON"   > .gsheets-token.json
          printf '%s' "$GDRIVE_PO_TOKEN_JSON" > .gdrive-po-token.json
          # Validate each is well-formed JSON WITHOUT printing contents
          # (jq stderr can echo a fragment of a mangled secret -> silence it).
          for f in config.json .gsheets-token.json .gdrive-po-token.json; do
            if jq empty "$f" 2>/dev/null; then echo "$f: ok"; else echo "$f: INVALID JSON"; exit 1; fi
          done

      - name: Run PO-Daily batch (headless)
        shell: bash
        env:
          # Runners are UTC; mint RUN_IDs and execution-log timestamps in
          # Bangkok so they match the +07 heading the log writer emits.
          TZ: Asia/Bangkok
          # Both environments' credentials are exported; config.mjs picks the pair
          # that matches --env. Neither falls back to the other.
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
          ODOO_USERNAME_PROD: ${{ secrets.ODOO_USERNAME_PROD }}
          ODOO_PASSWORD_PROD: ${{ secrets.ODOO_PASSWORD_PROD }}
          GDRIVE_CLIENT_ID: ${{ vars.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          # Cloudflare Access service token — opens the gha door from the cloud runner.
          # No-op locally (cfAccessHeaders() returns {} when these are unset).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CF_ACCESS_CLIENT_ID_PROD: ${{ secrets.CF_ACCESS_CLIENT_ID_PROD }}
          CF_ACCESS_CLIENT_SECRET_PROD: ${{ secrets.CF_ACCESS_CLIENT_SECRET_PROD }}
          # Defaults are spelled out rather than relying on the input defaults
          # above: on a `schedule` trigger there are no inputs at all, so
          # `inputs.environment` is the empty string. --env="" makes config.mjs
          # fall through to its own 'uat' default, and every scheduled run would
          # quietly sweep UAT while reporting success. The fallbacks below are
          # what make the cron actually production.
          ENVIRONMENT: ${{ inputs.environment || 'prod' }}
          BU: ${{ inputs.bu }}
          DATE: ${{ inputs.date }}
          MAXP: ${{ inputs.max_parallel || '2' }}
          # Which cron fired, blank on a manual run. The only way to tell the
          # schedule entries apart -- they share one workflow so they stay in
          # step with each other. With the intraday slots listed one per line
          # this names the exact slot, so a dropped one is visible in the log
          # rather than inferred from firing times.
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # The 00:30 UTC entry is the yesterday sweep. TZ is Asia/Bangkok (set
          # above), so `date -d yesterday` is yesterday in Bangkok, not UTC --
          # which matters at 07:30 local, when UTC is still on the previous day.
          if [ "$SCHEDULE" = "30 0 * * *" ]; then
            DATE=$(date -d yesterday +%Y-%m-%d)
            echo "[RUN] yesterday sweep — catching POs raised or edited after the last sweep"
          fi
          # Blank BU = all order-folder BUs (run-po-daily-batch enumerates them);
          # one code = single BU. Blank date = today (the pipeline defaults it).
          if [ -n "$BU" ]; then BU_FLAG="--bu=$BU"; MAXP=1; fi
          if [ -n "$DATE" ]; then DATE_FLAG="--date $DATE"; fi
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "[RUN] *** PRODUCTION *** — these are real POs"
          fi
          # Printed on every run, including manual ones, so the yesterday
          # sweep's date arithmetic can be checked without waiting for 07:30 to
          # come round -- `date -d` is GNU syntax and this is a Windows runner.
          echo "[RUN] clock: now=$(date +'%Y-%m-%d %H:%M %Z') yesterday=$(date -d yesterday +%Y-%m-%d)"
          echo "[RUN] env=$ENVIRONMENT | bu=${BU:-ALL} | date=${DATE:-today} | max-parallel=$MAXP"
          node run-po-daily-batch.mjs $BU_FLAG $DATE_FLAG --headless --max-parallel="$MAXP" --env="$ENVIRONMENT"

      - name: Upload run summary (structured files only)
        # NOT runs/** — the raw per-BU .log is unfiltered child stderr, and
        # artifact contents are stored UNMASKED (GitHub only masks the live log
        # view). Upload only the structured files, built from named fields.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: po-daily-summary
          path: |
            runs/**/summary.md
            runs/**/summary.json
            runs/**/*.result.json
          if-no-files-found: warn
